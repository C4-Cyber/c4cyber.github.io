<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | C4 Cyber</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f7f6f3; --card:#fff; --ink:#17191c; --dim:#6b6760; --navy:#284389; --rule:#dcdad4; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
      background:var(--paper); color:var(--ink); font-family:"Inter",system-ui,sans-serif; padding:2rem;
      background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
      background-size:52px 52px; }
    .wrap { max-width:520px; background:var(--card); border:1px solid #c8c5bd; padding:48px 40px; }
    img { width:60px; height:60px; margin:0 auto 1.4rem; display:block; }
    h1 { font-family:"Space Grotesk",sans-serif; font-size:clamp(2.6rem,9vw,4rem); margin:0; letter-spacing:-.03em; color:var(--navy); }
    p { color:var(--dim); font-size:1.05rem; margin:.6rem 0 2rem; }
    a { display:inline-flex; align-items:center; gap:.5em; font-family:"Space Grotesk",sans-serif; font-weight:600;
      color:#fff; text-decoration:none; background:var(--navy); padding:.8em 1.6em; border-radius:3px; }
    a:hover { background:#1d3167; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/img/logo-mark.png" alt="C4 Cyber" />
    <h1>404</h1>
    <p>That page has slipped through the cracks. Let's get you back to safety.</p>
    <a href="/">Return home</a>
  </div>
</body>
</html>
